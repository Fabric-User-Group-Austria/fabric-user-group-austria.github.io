 {% assign imgPath = card.name | replace: "#", "" | replace: " ", "" %}
<a class="card" href="{{card.url}}">
  <img class="card__bg" 
    src="/img/termine/{{imgPath}}.webp"
    loading="lazy"
    onerror="if (!this.src.endsWith('fallback.webp')) this.src = '/img/termine/fallback.webp'">
  <div class="card__number">{{card.name}}</div>
  <div class="card__info">
    {{card.datestring}} @ {{card.location.name}}
  </div>
</a>
